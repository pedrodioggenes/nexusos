name: Deploy to Supabase External

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref aocrxaercsmgcnybdsto -p ${{ secrets.SUPABASE_DB_PASSWORD }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Mark pre-existing migrations as applied
        run: |
          for f in supabase/migrations/*.sql; do
            version=$(basename "$f" | cut -d_ -f1)
            # Skip all migrations up to and including the storage bucket rename
            # 20260313190000_rename_storage_bucket.sql manipulates storage tables
            # which Supabase blocks via triggers — handled in next step via API
            if [[ "$version" < "20260313200000" ]]; then
              supabase migration repair --status applied "$version" 2>/dev/null || true
            fi
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Rename storage bucket (hiperia-documents → ia-documents)
        continue-on-error: false
        run: |
          set -euo pipefail
          PROJECT_REF="aocrxaercsmgcnybdsto"
          URL="https://${PROJECT_REF}.supabase.co"

          # Get service role key via CLI
          SERVICE_KEY=$(supabase projects api-keys --project-ref "$PROJECT_REF" 2>/dev/null \
            | grep -i "service_role\|SERVICE" | grep -o 'eyJ[A-Za-z0-9._-]*' | head -1)
          if [ -z "$SERVICE_KEY" ]; then
            echo "::error::Could not retrieve service role key"
            exit 1
          fi

          # Check if old bucket exists
          OLD_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/storage/v1/bucket/hiperia-documents" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY")

          # Check if new bucket exists
          NEW_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/storage/v1/bucket/ia-documents" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY")

          echo "Old bucket (hiperia-documents): $OLD_STATUS"
          echo "New bucket (ia-documents): $NEW_STATUS"

          # Already renamed — nothing to do
          if [ "$OLD_STATUS" != "200" ] && [ "$NEW_STATUS" = "200" ]; then
            echo "✅ Bucket already renamed. Skipping."
            exit 0
          fi

          # Neither exists — nothing to do
          if [ "$OLD_STATUS" != "200" ] && [ "$NEW_STATUS" != "200" ]; then
            echo "⚠️ Neither bucket exists. Skipping."
            exit 0
          fi

          # Step 1: Create new bucket via Storage API (if not exists)
          if [ "$NEW_STATUS" != "200" ]; then
            echo "📦 Creating ia-documents bucket via Storage API..."
            RESULT=$(curl -s -X POST "$URL/storage/v1/bucket" \
              -H "apikey: $SERVICE_KEY" \
              -H "Authorization: Bearer $SERVICE_KEY" \
              -H "Content-Type: application/json" \
              -d '{"id":"ia-documents","name":"ia-documents","public":false}')
            echo "Create result: $RESULT"
          else
            echo "📦 ia-documents bucket already exists."
          fi

          # Step 2: Move objects via direct DB connection (UPDATE is allowed)
          echo "🔄 Moving objects from hiperia-documents to ia-documents..."
          DB_URL="postgresql://postgres.${PROJECT_REF}:${DB_PASSWORD}@aws-0-sa-east-1.pooler.supabase.com:6543/postgres"
          MOVED=$(PGPASSWORD="${DB_PASSWORD}" psql "${DB_URL}" -t -A \
            -c "UPDATE storage.objects SET bucket_id = 'ia-documents' WHERE bucket_id = 'hiperia-documents' RETURNING id;" 2>/dev/null | wc -l || echo "0")
          echo "Moved ${MOVED} objects."

          # Step 3: Empty and delete old bucket via Storage API
          echo "🗑️ Emptying old hiperia-documents bucket..."
          curl -s -X POST "$URL/storage/v1/bucket/hiperia-documents/empty" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" || true

          echo "🗑️ Deleting old hiperia-documents bucket..."
          DEL_RESULT=$(curl -s -X DELETE "$URL/storage/v1/bucket/hiperia-documents" \
            -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY")
          echo "Delete result: $DEL_RESULT"

          echo "✅ Bucket rename complete."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy edge functions
        run: supabase functions deploy --project-ref aocrxaercsmgcnybdsto
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
